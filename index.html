<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amore</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #f8f8f8;
        }

        /* バナー */
        .banner {
            display: block;
            width: 66.6667%;
            height: auto;
            margin: 0 auto;
        }

        /* 画像・リンク共通 */
        .page-link {
            display: block;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* 画像 */
        .page-link img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* LINE案内 */
        .line-text {
            width: 100%;
            max-width: 900px;
            margin: 15px auto;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #06c755;
        }

        /* 最下部メッセージ */
        .ai-text {
            width: 100%;
            max-width: 900px;
            margin: 25px auto 30px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            line-height: 1.8;
            color: #333;
        }
    </style>
</head>

<body>

    <!-- バナー -->
    <img class="banner" src="baner.png" alt="baner">

    <!-- LINE友達登録案内 -->
    <div class="line-text">
        ↓クリックでLINE友達登録↓
    </div>

    <!-- Amore画像（クリックでLINE） -->
    <a
        href="https://lin.ee/xxxxx"
        class="page-link"
        target="_blank"
        rel="noopener noreferrer">

        <img src="Amore.jpeg" alt="Amore">

    </a>

    <!-- AIマッチング案内 -->
    <div class="ai-text">
        アモーレでは最新AIを駆使し<br>
        お客様に最適な相手をマッチング！
    </div>

</body>

</html>
