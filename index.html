<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amore</title>

    <style>
        /* ページ全体 */
        body {
            margin: 0;
            background-color: #f8f8f8;
            text-align: center;
        }

        /* タイトル */
        h1 {
            margin: 20px 0;
            font-size: 32px;
            color: #333;
        }

        /* メイン */
        main {
            width: 100%;
            text-align: center;
        }

        /* 画像 */
        main img {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* スマホ用 */
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
                margin: 15px 0;
            }

            main img {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <h1>Amore</h1>

    <main>
        <img src="Amore.jpeg" alt="Amore">
    </main>

</body>
</html>
